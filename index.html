<html lang="ar" dir="rtl">
<head>

<style>
:root{--bg:#f4f6f6;--card:#fff;--tx:#14201f;--mut:#5b6b69;--pri:#0f766e;--prit:#fff;--bad:#b42318;--ok:#067647;--line:#dbe3e2}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0e1514;--card:#17211f;--tx:#e6efed;--mut:#9bb0ac;--pri:#2dd4bf;--prit:#06201c;--bad:#ff8a80;--ok:#6ee7a8;--line:#2a3836}}
:root[data-theme=dark]{--bg:#0e1514;--card:#17211f;--tx:#e6efed;--mut:#9bb0ac;--pri:#2dd4bf;--prit:#06201c;--bad:#ff8a80;--ok:#6ee7a8;--line:#2a3836}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:150px}
header{background:var(--pri);color:var(--prit);padding:12px 16px;font-weight:700;font-size:19px;display:flex;justify-content:space-between;align-items:center}
#bell{position:relative;cursor:pointer;font-size:22px}#bell b{position:absolute;top:-6px;inset-inline-start:-8px;background:#d92d20;color:#fff;border-radius:10px;font-size:12px;padding:0 6px}
main{padding:14px;max-width:680px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:18px}.mut{color:var(--mut);font-size:15px}.big{font-size:26px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin:6px 0}
button{font:inherit;font-weight:700;padding:13px 16px;border:0;border-radius:12px;background:var(--pri);color:var(--prit);width:100%;margin-top:8px;cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:2px solid var(--pri)}button.bad{background:var(--bad);color:#fff}button:disabled{opacity:.45}
button.mini{width:auto;padding:4px 12px;margin:0;font-size:16px}
label.chk{display:flex;align-items:center;gap:10px;padding:8px 0}label.chk input{width:24px;height:24px;margin:0}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.note{padding:12px;border-radius:12px;margin-bottom:12px;font-weight:600}.warn{background:#fff3cd;color:#664d03}.err{background:#fde7e5;color:var(--bad)}.okm{background:#dcfae6;color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{margin:0;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{width:auto;margin:0;padding:8px 12px;font-size:15px}
.low{color:var(--bad)}.pill{font-size:13px;padding:2px 8px;border-radius:8px;background:var(--line)}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;padding:12px 2px;font-size:14px;color:var(--mut);font-weight:700;cursor:pointer}nav a.on{color:var(--pri)}
#fab{position:fixed;bottom:76px;inset-inline-start:14px;width:56px;height:56px;border-radius:50%;padding:0;margin:0;font-size:26px;z-index:6;box-shadow:0 4px 12px #0004}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding:14px;display:none}#sheet.on{display:block}
.invoice table{width:100%;border-collapse:collapse}.invoice td,.invoice th{padding:6px;border-bottom:1px solid var(--line);text-align:start}
@media print{header,nav,#fab,#sheet,.noprint,button{display:none!important}body{background:#fff;color:#000;padding:0}.card{border:0}.invoice{display:block!important}}

.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
header{gap:10px}#bell{display:flex;align-items:center}#bell .ic{width:26px;height:26px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px}nav a .ic{width:25px;height:25px}
button .ic{margin-inline-end:6px;width:20px;height:20px}button.mini .ic{margin:0}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--card);color:var(--tx);border:1px solid var(--line);padding:16px 8px;font-size:15px}.tile .ic{width:30px;height:30px;color:var(--pri);margin:0}
.li{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}.li:last-child{border:0}.li .ic{color:var(--pri);width:26px;height:26px}.li span{flex:1}.li .ic.ch{width:18px;height:18px;color:var(--mut)}
details.fold{padding:0}details.fold>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--pri)}details.fold>summary::-webkit-details-marker{display:none}details.fold[open]>summary{border-bottom:1px solid var(--line)}details.fold>div{padding:6px 14px 14px}
.srch{display:flex;gap:8px;align-items:center}.srch input{flex:1}.srch button{width:52px;height:50px;padding:0;margin:0;flex:none;display:flex;align-items:center;justify-content:center}.srch button .ic{margin:0}
body.out header,body.out nav{display:none}body.out{padding-bottom:20px}
.lg{max-width:360px;margin:0 auto;text-align:center;padding-top:18px}.lgl{width:84px;height:84px;border-radius:24px;background:var(--pri);color:var(--prit);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}.lgl .ic{width:46px;height:46px;stroke-width:1.5}
.lgn{font-size:26px;font-weight:800}.users{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.users button{width:auto;margin:0;padding:8px 16px}
.dots{display:flex;gap:14px;justify-content:center;margin:14px 0 18px;min-height:20px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.dots i.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}.pad button{margin:0;height:64px;font-size:26px;background:var(--card);color:var(--tx);border:1px solid var(--line)}.pad button.go{background:var(--pri);color:var(--prit)}
#scan{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;padding:12px;gap:8px}#scan.on{display:flex}#scan video{flex:1;min-height:0;width:100%;object-fit:cover;border-radius:12px}#scan .sb{color:#fff;text-align:center;font-weight:700}
.li small,.row small{color:var(--mut);display:block;font-size:13px;font-weight:400}.pill.arc{background:#fde7e5;color:var(--bad)}
</style>
</head>
<body>
<header><span id="title">ESPIRATI 1.0</span><span id="bell" onclick="A.go('notes')"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
<button id="fab" onclick="A.ai()" style="display:none" aria-label="المساعد"><svg class="ic" style="width:28px;height:28px;margin:0" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg></button>
<div id="sheet"></div>
<div id="scan"></div>
<script>
'use strict';
const L = (function () {
  const THRESHOLD = 500000;
  const TYPES = { ACCRUAL: 'مستحق بنشر', SALARY_DUE: 'راتب مستحق', ADVANCE: 'سلفة', WITHDRAWAL: 'سحب', PAYMENT: 'دفعة تسوية' };
  const fail = (m) => { throw new Error(m); };
  const isInt = (n) => Number.isInteger(n) && n > 0;

  function newState() {
    return { v: 2, seq: 3, people: [], entries: [], days: [], supplies: [], liquidations: [], deficit: 0, log: [],
             accounts: [{ id: 1, name: 'الصندوق', type: 'cash', opening: 0 }], tx: [], warehouses: [{ id: 2, name: 'المخزن الرئيسي' }],
             items: [], parties: [], sales: [], salesReturns: [], purchases: [], purchaseReturns: [], expenses: [], revenues: [], recurring: [],
             debts: [], adjustments: [], users: [], keys: {}, counters: { sale: 0, purchase: 0, ret: 0 }, assistantLog: [],
             settings: { owner: 'المالك', lastBackup: null, theme: 'auto', lockMin: 10, readNotes: {},
               units: ['حبة', 'دستة', 'كرتونة', 'لتر', 'جالون', 'جركان', 'زوج'],
               cats: ['إسبيرات الدراجات النارية', 'الزيوت والشحوم', 'البطاريات', 'الإطارات والأنابيب', 'مستلزمات البنشر', 'الإكسسوارات', 'أصناف أخرى', 'عبوات فارغة'],
               expCats: ['إيجار', 'كهرباء وماء', 'رواتب وأجور', 'نقل', 'حوافز البنشر', 'صيانة', 'متنوعة'] } };
  }
  const nid = (s) => s.seq++;
  const addLog = (s, actor, action, detail) => s.log.push({ at: new Date().toISOString(), actor, action, detail });

  function split(g) { const w = Math.floor(g * 40 / 100), c = Math.floor(g * 20 / 100); return { w, c, s: g - w - c }; }

  function distributeWorkers(share, ids) {
    if (!ids.length) fail('لا يوجد عامل حاضر');
    if (ids.length > 2) fail('عدد عمال البنشر الحاضرين في اليوم لا يتجاوز عاملين');
    const sorted = [...ids].sort((a, b) => a - b), each = Math.floor(share / sorted.length), rem = share - each * sorted.length;
    const out = {}; sorted.forEach((id, i) => { out[id] = each + (i === 0 ? rem : 0); }); return out;
  }

  function addPerson(s, p, actor) {
    const name = (p.name || '').trim();
    if (!name) fail('الاسم مطلوب');
    if (!['worker', 'employee', 'chief'].includes(p.kind)) fail('نوع غير صحيح');
    if (p.kind === 'chief' && s.people.some((x) => x.kind === 'chief')) fail('كبير الموظفين منصب ثابت وواحد فقط');
    const row = { id: nid(s), name, phone: (p.phone || '').trim(), kind: p.kind, active: true, start: new Date().toISOString().slice(0, 10) };
    s.people.push(row); addLog(s, actor, 'ADD_PERSON', name); return row;
  }
  function person(s, id) { const p = s.people.find((x) => x.id === id); if (!p) fail('الشخص غير موجود'); return p; }

  function balance(s, id) {
    let b = 0;
    for (const e of s.entries) if (e.personId === id) b += (e.type === 'ACCRUAL' || e.type === 'SALARY_DUE') ? e.amount : -e.amount;
    return b;
  }

  function addEntry(s, pid, type, amount, ref, actor) {
    const p = person(s, pid);
    if (!TYPES[type]) fail('نوع القيد غير صحيح');
    if (!isInt(amount)) fail('المبلغ يجب أن يكون رقماً صحيحاً أكبر من صفر');
    if (type === 'SALARY_DUE' && p.kind !== 'employee') fail('الرواتب للموظفين فقط، وعمال البنشر مستحقاتهم من نسبة البنشر');
    if (type === 'ACCRUAL') fail('مستحقات البنشر تُسجَّل تلقائياً من دخل اليوم');
    if (!ref) fail('مفتاح العملية مطلوب');
    if (s.entries.some((e) => e.ref === ref)) fail('هذه العملية مسجلة من قبل');
    if (type === 'ADVANCE' || type === 'WITHDRAWAL' || type === 'PAYMENT') {
      const c = cashAcc(s); needFunds(s, c.id, amount);
      postTx(s, c.id, -amount, 'staff_' + type, 'T-' + ref, p.name, actor);
    }
    s.entries.push({ id: nid(s), personId: pid, type, amount, ref, at: new Date().toISOString(), by: actor });
    addLog(s, actor, 'ENTRY_' + type, p.name + ' ' + amount);
  }

  function openDays(s) { return s.days.filter((d) => !d.liq); }
  function openTotals(s) {
    const d = openDays(s), sum = (k) => d.reduce((a, x) => a + x[k], 0);
    const supplies = s.supplies.filter((x) => !x.liq).reduce((a, x) => a + x.amount, 0);
    const shop = sum('s');
    return { gross: sum('gross'), w: sum('w'), c: sum('c'), s: shop, supplies, deficit: s.deficit, net: shop - supplies - s.deficit };
  }
  const openBalance = (s) => openTotals(s).gross;

  function recordDay(s, date, gross, presentIds, actor) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) fail('التاريخ غير صحيح');
    if (!isInt(gross)) fail('دخل البنشر يجب أن يكون رقماً صحيحاً أكبر من صفر');
    if (s.days.some((d) => d.date === date)) fail('دخل هذا اليوم مسجل مسبقاً: ' + date);
    const present = (presentIds || []).filter((id) => { const p = s.people.find((x) => x.id === id); return p && p.kind === 'worker' && p.active; });
    if (!present.length) fail('غاب العاملان: لا يوجد دخل بنشر لهذا اليوم');
    const sp = split(gross), shares = distributeWorkers(sp.w, present);
    for (const id of present) if (s.entries.some((e) => e.ref === 'PD-' + date + '-' + id)) fail('مستحقات هذا اليوم مسجلة من قبل');
    for (const id of present) if (shares[id] > 0)
      s.entries.push({ id: nid(s), personId: id, type: 'ACCRUAL', amount: shares[id], ref: 'PD-' + date + '-' + id, at: new Date().toISOString(), by: actor });
    s.days.push({ id: nid(s), date, gross, w: sp.w, c: sp.c, s: sp.s, present, liq: null });
    addLog(s, actor, 'PUNCTURE_DAY', date + ' ' + gross);
  }

  function addSupplies(s, amount, note, actor) {
    if (!isInt(amount)) fail('تكلفة المستلزمات يجب أن تكون رقماً أكبر من صفر');
    s.supplies.push({ id: nid(s), amount, note: note || '', at: new Date().toISOString(), liq: null });
    addLog(s, actor, 'PUNCTURE_SUPPLIES', String(amount));
  }

  function liquidate(s, o) {
    const t = openTotals(s);
    if (!o.approver || !o.approver.trim()) fail('اسم المعتمد مطلوب');
    if (!openDays(s).length && !t.supplies && !s.deficit) fail('لا يوجد رصيد للتصفية');
    if (o.urgent) { if (!o.reason || !o.reason.trim()) fail('سبب التصفية المستعجلة مطلوب'); }
    else if (t.gross < THRESHOLD) fail('لم يبلغ الرصيد حد التصفية (' + THRESHOLD + ')');
    const id = nid(s), net = t.net;
    const rec = { id, at: new Date().toISOString(), urgent: !!o.urgent, reason: o.urgent ? o.reason.trim() : '', approver: o.approver,
                  gross: t.gross, workersAlreadyAccrued: t.w, chief: t.c, shopNet: Math.max(0, net), supplies: t.supplies,
                  deficitIn: s.deficit, deficitOut: net < 0 ? -net : 0 };
    openDays(s).forEach((d) => { d.liq = id; });
    s.supplies.forEach((x) => { if (!x.liq) x.liq = id; });
    s.deficit = rec.deficitOut; s.liquidations.push(rec);
    addLog(s, o.approver, o.urgent ? 'LIQUIDATE_URGENT' : 'LIQUIDATE', JSON.stringify(rec)); return rec;
  }

  const exportJSON = (s) => JSON.stringify(s);
  function importJSON(text) {
    let o; try { o = JSON.parse(text); } catch (e) { fail('الملف ليس نسخة احتياطية صحيحة'); }
    if (!o || (o.v !== 1 && o.v !== 2) || !['people', 'entries', 'days', 'supplies', 'liquidations', 'log'].every((k) => Array.isArray(o[k])) || typeof o.seq !== 'number')
      fail('الملف ليس نسخة احتياطية صحيحة');
    const d = newState();
    for (const k of Object.keys(d)) if (o[k] === undefined) o[k] = d[k];
    o.settings = Object.assign(d.settings, o.settings || {}); o.deficit = o.deficit || 0; o.v = 2; return o;
  }
  // ================= الأدوات العامة =================
  const nowIso = () => new Date().toISOString();
  const int0 = (n) => { if (n === undefined || n === null || n === '' || Number.isNaN(n)) return 0; if (!Number.isInteger(n) || n < 0) fail('قيمة رقمية غير صحيحة'); return n; };
  const pad = (n) => String(n).padStart(4, '0');
  function claim(s, key) { if (!key) fail('مفتاح العملية مطلوب'); if (s.keys[key]) fail('هذه العملية محفوظة مسبقاً'); s.keys[key] = 1; }

  // ================= الخزينة والبنوك =================
  const cashAcc = (s) => s.accounts.find((a) => a.type === 'cash');
  function account(s, id) { const a = s.accounts.find((x) => x.id === Number(id)); if (!a) fail('الحساب غير موجود'); return a; }
  function accBalance(s, id) { const a = account(s, id); return a.opening + s.tx.filter((t) => t.accId === a.id).reduce((x, t) => x + t.amount, 0); }
  function needFunds(s, id, amount) { if (accBalance(s, id) < amount) fail('رصيد «' + account(s, id).name + '» لا يكفي'); }
  function postTx(s, accId, amount, kind, ref, note, actor, at) {
    account(s, accId);
    if (!Number.isInteger(amount) || amount === 0) fail('المبلغ غير صحيح');
    if (!ref) fail('مفتاح العملية مطلوب');
    if (s.tx.some((t) => t.ref === ref)) fail('هذه العملية مسجلة من قبل');
    s.tx.push({ id: nid(s), accId: Number(accId), amount, kind, ref, note: note || '', by: actor, at: at || nowIso() });
  }
  function addAccount(s, o, actor) {
    const name = (o.name || '').trim(); if (!name) fail('اسم الحساب مطلوب');
    if (!['cash', 'bank'].includes(o.type)) fail('نوع الحساب غير صحيح');
    const a = { id: nid(s), name, type: o.type, opening: Number.isInteger(o.opening) ? o.opening : 0 };
    s.accounts.push(a); addLog(s, actor, 'ADD_ACCOUNT', name); return a;
  }
  function deposit(s, accId, amount, key, note, actor) { if (!isInt(amount)) fail('المبلغ يجب أن يكون أكبر من صفر'); claim(s, key); postTx(s, accId, amount, 'deposit', 'D-' + key, note, actor); addLog(s, actor, 'DEPOSIT', amount + ''); }
  function withdraw(s, accId, amount, key, note, actor) { if (!isInt(amount)) fail('المبلغ يجب أن يكون أكبر من صفر'); claim(s, key); needFunds(s, accId, amount); postTx(s, accId, -amount, 'withdraw', 'W-' + key, note, actor); addLog(s, actor, 'WITHDRAW', amount + ''); }
  function bankFee(s, accId, amount, key, note, actor) { if (!isInt(amount)) fail('المبلغ يجب أن يكون أكبر من صفر'); claim(s, key); needFunds(s, accId, amount); postTx(s, accId, -amount, 'fee', 'F-' + key, note || 'رسوم وعمولات', actor); }
  function transfer(s, from, to, amount, key, actor) {
    if (Number(from) === Number(to)) fail('اختر حسابين مختلفين'); if (!isInt(amount)) fail('المبلغ يجب أن يكون أكبر من صفر');
    account(s, from); account(s, to); claim(s, key); needFunds(s, from, amount);
    postTx(s, from, -amount, 'transfer_out', 'TO-' + key, 'تحويل', actor); postTx(s, to, amount, 'transfer_in', 'TI-' + key, 'تحويل', actor);
  }
  function reconcile(s, accId, actual, key, actor) {
    if (!Number.isInteger(actual) || actual < 0) fail('الرصيد الفعلي غير صحيح'); claim(s, key);
    const diff = actual - accBalance(s, accId); if (diff !== 0) postTx(s, accId, diff, 'recon', 'RC-' + key, 'مطابقة الرصيد الفعلي', actor); return diff;
  }

  // ================= الأطراف (زبائن وموردون) =================
  function addParty(s, o, actor) {
    const name = (o.name || '').trim(); if (!name) fail('الاسم مطلوب');
    if (!['customer', 'supplier'].includes(o.kind)) fail('نوع غير صحيح');
    const p = { id: nid(s), kind: o.kind, name, phone: (o.phone || '').trim(), address: o.address || '', notes: o.notes || '', creditLimit: int0(o.creditLimit), rating: o.rating || 0, fav: !!o.fav };
    s.parties.push(p); addLog(s, actor, 'ADD_PARTY', name); return p;
  }
  function party(s, id) { const p = s.parties.find((x) => x.id === Number(id)); if (!p) fail('الطرف غير موجود'); return p; }

  // ================= الأصناف والمخزون =================
  const CAT_PUNCT = 'مستلزمات البنشر';
  function item(s, id) { const i = s.items.find((x) => x.id === Number(id)); if (!i) fail('الصنف غير موجود'); return i; }
  const qtyOf = (it, wh) => it.stock[wh] || 0;
  const totalQty = (it) => Object.values(it.stock).reduce((a, b) => a + b, 0);
  function stockIn(it, wh, qty, unitCost) { const tot = totalQty(it); it.avg = Math.round((it.avg * tot + unitCost * qty) / (tot + qty) * 10000) / 10000; it.stock[wh] = qtyOf(it, wh) + qty; }
  function stockOut(it, wh, qty) {
    if (qtyOf(it, wh) < qty) fail('الكمية المطلوبة من «' + it.name + '» أكبر من المتاح (' + qtyOf(it, wh) + ')');
    it.stock[wh] = qtyOf(it, wh) - qty; return it.avg;
  }
  function addItem(s, o, actor) {
    const name = (o.name || '').trim(); if (!name) fail('اسم الصنف مطلوب');
    const code = (o.code || '').trim(), bc = (o.barcode || '').trim();
    if (code && s.items.some((i) => i.code === code)) fail('الكود مستخدم لصنف آخر');

const idbOpen = () => new Promise((res) => { try { const r = indexedDB.open('espirati', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { DB = r.result; res(DB); }; r.onerror = () => res(null); r.onblocked = () => res(null); } catch (e) { res(null); } });
const idbGet = () => new Promise((res) => { if (!DB) return res(null); try { const q = DB.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } });
function idbPut(j) { if (!DB) return; try { const t = DB.transaction('kv', 'readwrite'); t.objectStore('kv').put(j, 'state'); t.onerror = () => { msg = { t: 'err', m: 'تعذر الحفظ في قاعدة الهاتف' }; }; } catch (e) {} }
function save() {
  try {
    S._t = Date.now(); const j = JSON.stringify(S); idbPut(j);
    try { localStorage.setItem(KEY, j); } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} if (!DB) { msg = { t: 'err', m: 'تعذر حفظ البيانات: ' + e.message }; return false; } }
    return true;
  } catch (e) { msg = { t: 'err', m: 'تعذر حفظ البيانات: ' + e.message }; return false; }
}
// الجلسة: لا يُطلب الرمز من جديد إلا بعد انقضاء مهلة القفل (حتى لو أغلق النظام التطبيق في الخلفية)
const SES = 'espirati.session', lockMs = () => (S.settings.lockMin == null ? 10 : S.settings.lockMin) * 60000;
function touch() { try { if (cur) localStorage.setItem(SES, JSON.stringify({ u: cur.id, t: Date.now() })); } catch (e) {} }
function endSession() { try { localStorage.removeItem(SES); } catch (e) {} }
function restoreSession() { try { const x = JSON.parse(localStorage.getItem(SES) || 'null'); if (!x) return; const u = S.users.find((y) => y.id === x.u && y.active); if (u && (lockMs() === 0 || Date.now() - x.t < lockMs())) cur = u; } catch (e) {} }
async function init() {
  await idbOpen(); const j = await idbGet();
  if (j) { try { const ns = L.importJSON(j); if (!S.users.length || (ns._t || 0) >= (S._t || 0)) S = ns; } catch (e) {} }
  if (S.users.length) save();
  restoreSession(); ready = true; render();
}

/** تنفيذ عملية: صلاحية → منطق → حفظ. عند أي خطأ تُستعاد البيانات كما كانت (لا أثر جزئي). */
function act(perm, fn, kn) {
  const snap = JSON.stringify(S);
  try {
    if (perm && !need(perm)) throw new Error('لا تملك صلاحية تنفيذ هذه العملية');
    const r = fn();
    if (!save()) { S = JSON.parse(snap); paintMsg(); return false; }
    if (kn) delete fk[kn];
    msg = r ? { t: 'okm', m: r } : null; render(); return true;
  } catch (e) { S = JSON.parse(snap); msg = { t: 'err', m: e.message }; paintMsg(); return false; }
}

// ---------- الأمان: PIN ----------
async function hashPin(pin, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(salt), iterations: 100000 }, k, 256);
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
}
const rnd = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map((x) => x.toString(16).padStart(2, '0')).join('');
const goodPin = (p) => /^\d{4,8}$/.test(p);

  // البيع والشراء
  search(kind, v) {
    const q = L.norm(v).toLowerCase(), isS = kind === 'sale';

      return say(h);
    }
    say('<div class="note warn">لم أفهم الأمر. جرّب: «بعت 3 زيوت و2 بوجيه نقداً» أو «مبيعات اليوم» أو «الناقص» أو «رصيد أحمد».</div>');
  },
  aiApply(kind) {
    const d = window.__draft, C = carts[kind]; C.lines = []; let miss = 0;
    d.lines.forEach((l, i) => { if (!l.candidates.length) { miss++; return; } const name = val('ai_c' + i) || l.candidates[0], it = S.items.find((x) => x.name === name); C.lines.push({ itemId: it.id, name: it.name, qty: l.qty, factor: 1, unit: it.unit, p: kind === 'sale' ? it.sell : it.buy, disc: 0, pk: -1 }); });
    const t = cartTotals(kind); C.cash = d.pay === 'cash' ? String(t.total) : ''; C.bank = d.pay === 'bank' ? String(t.total) : '';
    if (d.customer) { const q = L.norm(d.customer), p = S.parties.find((x) => x.kind === (kind === 'sale' ? 'customer' : 'supplier') && L.norm(x.name).includes(q)); if (p) C.party = String(p.id); }
    this.aiClose(); tab = kind === 'sale' ? 'sales' : 'purchases'; view = ''; msg = { t: 'warn', m: 'راجع المسودة ثم احفظ.' + (miss ? ' (' + miss + ' صنف غير موجود لم يُضف)' : '') + (d.pay === 'bank' ? ' أدخل رقم العملية البنكية.' : '') }; render();
  }
};
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function addLogLogin(u) { S.log.push({ at: new Date().toISOString(), actor: u.name, action: 'LOGIN', detail: '' }); save(); }

// ---------- العرض ----------
const SCREENS = { home, sales, items, purchases, parties, debts, money, puncture, people, reports, settings, notes, more };
const NAV = [['home', 'الرئيسية'], ['sales', 'المبيعات'], ['items', 'الأصناف'], ['purchases', 'المشتريات'], ['more', 'المزيد']];
function render() {
  applyTheme(); const nav = $('nav'), main = $('main'), fab = $('fab'), bell = $('bell');
  document.body.classList.toggle('out', !cur);
  if (!ready) { main.innerHTML = '<div class="mut" style="text-align:center;padding:60px">جارٍ التحميل…</div>'; nav.innerHTML = ''; fab.style.display = 'none'; bell.innerHTML = ''; return; }
  if (!S.users.length) { document.body.classList.add('out'); main.innerHTML = '<div id="msg">' + banner() + '</div>' + setupScreen(); nav.innerHTML = ''; fab.style.display = 'none'; bell.innerHTML = ''; return; }
  if (!cur) { main.innerHTML = loginScreen(); nav.innerHTML = ''; fab.style.display = 'none'; bell.innerHTML = ''; return; }
  const f = SCREENS[tab] || home; let h; try { h = f(); } catch (e) { h = '<div class="note err">خطأ في العرض: ' + esc(e.message) + '</div><button onclick="A.go(\'home\')">الرئيسية</button>'; }
  main.innerHTML = (h.startsWith('<div id="msg">') ? '' : '<div id="msg">' + banner() + '</div>') + h;
  const more = ['parties', 'debts', 'money', 'puncture', 'people', 'reports', 'settings', 'notes', 'more'];
  nav.innerHTML = NAV.map((x) => '<a class="' + (tab === x[0] || (x[0] === 'more' && more.includes(tab)) ? 'on' : '') + '" onclick="A.go(\'' + x[0] + '\')">' + ic(x[0]) + x[1] + '</a>').join('');
  fab.style.display = 'block'; const n = unread().length; bell.innerHTML = ic('bell') + (n ? '<b>' + n + '</b>' : ''); touch();
}
let scanStream = null, scanTimer = null;
function itemFields(isNew) {
  const packs = val('i_packs').split(/[,،]/).map((x) => x.split('=')).filter((x) => x.length === 2 && N(x[1]) > 0).map((x) => ({ name: x[0].trim(), factor: N(x[1]) }));
  const f = { name: val('i_name'), code: val('i_code'), barcode: val('i_bc'), cat: val('i_cat'), unit: val('i_unit'), buy: N(val('i_buy')), sell: N(val('i_sell')), min: N(val('i_min')), supplierId: val('i_sup'), packs, notes: val('i_notes') };
  if (isNew) f.openQty = N(val('i_open')); return f;
}
function markRead(keys) { const sl = slot(), r = {}; const old = S.settings.readNotes || {}; Object.keys(old).forEach((k) => { if (old[k] === sl) r[k] = sl; }); keys.forEach((k) => { r[k] = sl; }); S.settings.readNotes = r; save(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) { hiddenAt = Date.now(); touch(); } else if (cur && lockMs() > 0 && Date.now() - hiddenAt > lockMs()) { cur = null; endSession(); pinBuf = ''; render(); } });
document.addEventListener('pointerdown', () => { if (cur) touch(); }, true);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
init();

</script>
